[package]
name = "dynamo-parsers-v2"
version = "0.8.4"
edition.workspace = true
license = "Apache-2.0"
description = "Token-incremental tool-call streaming parsers for Dynamo"
# This workspace test reads the shared schema corpus outside this crate.
exclude = ["tests/glm47_schema_conformance.rs"]

[features]
test-utils = []
# serde_json's `arbitrary_precision`, for a consumer that wants number text
# kept as sent. Off by default: Cargo turns it on for every crate in the
# build, and it changes how all of them read and write numbers
# (`tests/serde_json_features.rs`).
arbitrary-precision = ["serde_json/arbitrary_precision"]

[dependencies]
dynamo-structural-tag.workspace = true
openai-harmony = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
serde_yaml = "0.9"
regex = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
percent-encoding = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[[bench]]
name = "source_recording"
harness = false
